# ==============================================================================
# Karighar (कारीघर) — Production Enterprise Multi-Container Orchestration
# Ministry of Social Justice & Empowerment (MoSJE) | SIH 2026 Problem Statement #26090
# Deploys Unified HTTPS API, PostgreSQL 16 Cluster, Redis 7 State Bus & Nginx
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. Karighar Full-Stack Node.js Application Service
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: karighar_app
    restart: unless-stopped
    ports:
      - "8443:8443"
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8443
      - DB_ENGINE=postgres
      - DATABASE_URL=postgresql://karighar_admin:KarigharGov2026@postgres:5432/karighar_db
      - CACHE_ENGINE=redis
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=karighar_jwt_secure_key_2026_super_secret
      - GEM_WEBHOOK_SECRET=karighar_gem_secret_2026
      - PFMS_WEBHOOK_SECRET=karighar_pfms_secret_2026
      - ICEGATE_WEBHOOK_SECRET=karighar_icegate_secret_2026
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./certs:/app/certs:ro
      - audit_data:/app/backend
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "-", "https://localhost:8443/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - karighar_net

  # ----------------------------------------------------------------------------
  # 2. PostgreSQL 16 Enterprise Relational Database
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: karighar_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: karighar_admin
      POSTGRES_PASSWORD: KarigharGov2026
      POSTGRES_DB: karighar_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01_init_schema.sql:ro
      - ./backend/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karighar_admin -d karighar_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - karighar_net

  # ----------------------------------------------------------------------------
  # 3. Redis 7 High-Speed State & SSE Message Bus
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: karighar_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - karighar_net

volumes:
  pg_data:
    name: karighar_pg_data
  redis_data:
    name: karighar_redis_data
  audit_data:
    name: karighar_audit_data

networks:
  karighar_net:
    name: karighar_network
    driver: bridge
